[tool.poetry]
name = "x402-api"
version = "0.1.0"
description = "X402 Gateway · netstars/x402"
authors = ["Netstars <dev@netstars.jp>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = "^2.0"
aiomysql = "^0.2"
redis = { extras = ["hiredis"], version = "^5.2" }
httpx = "^0.27"
pydantic = "^2.9"
pydantic-settings = "^2.6"
structlog = "^24.4"
solders = ">=0.21,<1.0"        # Solana primitives (Pubkey, Message, Signature)

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"
mypy = "^1.13"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]  # asserts ok in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
