# =====================================================================
# X402 Gateway · CI
# Reference design: ../../token/.github/workflows/README.md
# (本文件是 token/ci.yml 的精简复制 — 单一 Python service，无 Console)
# =====================================================================
name: X402 CI

on:
  push:
    branches: [main]
    paths: ['netstars/x402/**']
  pull_request:
    paths: ['netstars/x402/**']

concurrency:
  group: ci-x402-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write

defaults:
  run:
    working-directory: netstars/x402

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: x402_app, POSTGRES_PASSWORD: x402_app_test, POSTGRES_DB: x402_test}
        options: >-
          --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-root --with dev
      - name: Lint + types
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy src/
      - name: Apply schema
        env: {PGPASSWORD: x402_app_test}
        run: psql -h localhost -U x402_app -d x402_test -f db/SCHEMA.sql
      - name: Test
        env:
          DATABASE_URL: postgresql://x402_app:x402_app_test@localhost:5432/x402_test
          REDIS_URL: redis://localhost:6379/0
        run: poetry run pytest --cov=src --cov-report=xml --cov-fail-under=80

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with: {config: 'p/python p/security-audit p/owasp-top-ten'}

  build:
    needs: [test, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_TOOLING }}:role/gh-actions-x402-ci
          aws-region: ap-northeast-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v5
        with:
          context: netstars/x402
          file: netstars/x402/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/x402-token-market/x402/${{ matrix.service }}:main-${{ github.sha }}
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_REGISTRY }}/x402-token-market/x402/${{ matrix.service }}:main-${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
