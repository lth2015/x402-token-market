# =====================================================================
# Token System · Deploy to single QA env
# Simplified for v1.2: only `qa` env. Prod will be added when business decides.
#
# Trigger: main branch push → auto deploy to qa
#          workflow_dispatch → manual with image_tag
# =====================================================================
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'netstars/token/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: main-<sha>)'
        required: false

concurrency:
  group: deploy-token-qa
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  deployments: write

env:
  AWS_REGION: ap-northeast-1
  EKS_CLUSTER: netstars-qa
  NAMESPACE: token

jobs:
  migrate:
    name: Run DB migration
    runs-on: ubuntu-latest
    environment:
      name: qa
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_QA }}:role/gh-actions-token-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.tar.gz \
            | tar xvz
          sudo mv migrate /usr/local/bin/

      - name: Fetch DB creds
        id: db
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id /qa/token/db-credentials --query SecretString --output text)
          echo "DSN=mysql://$(echo $SECRET | jq -r '.username'):$(echo $SECRET | jq -r '.password')@tcp($(echo $SECRET | jq -r '.host'):$(echo $SECRET | jq -r '.port'))/$(echo $SECRET | jq -r '.dbname')?tls=true" >> $GITHUB_OUTPUT

      - name: Migrate up
        run: |
          migrate -path netstars/token/db/migrations -database "${{ steps.db.outputs.DSN }}" up

  deploy:
    name: Deploy to EKS
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://qa.app.netstars.jp
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=main-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_QA }}:role/gh-actions-token-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Substitute image tags in K8s YAML
        run: |
          # Replace placeholders in deployment.yaml
          sed -i "s|REPLACE_ECR|${{ secrets.ECR_REGISTRY }}|g; s|REPLACE_TAG|${{ steps.tag.outputs.tag }}|g" \
            infra/k8s/token/deployment.yaml
          sed -i "s|REPLACE_ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID_QA }}|g" \
            infra/k8s/token/*.yaml

      - name: Diff (dry-run)
        run: |
          kubectl diff -f infra/k8s/token/ || true

      - name: Apply
        run: |
          kubectl apply -f infra/k8s/token/

      - name: Wait for rollout
        run: |
          kubectl -n ${{ env.NAMESPACE }} rollout status deploy/token-api      --timeout=5m
          kubectl -n ${{ env.NAMESPACE }} rollout status deploy/token-console  --timeout=5m
          kubectl -n ${{ env.NAMESPACE }} rollout status deploy/token-worker   --timeout=5m

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://qa.api.netstars.jp/readyz && exit 0
            sleep 10
          done
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl -n ${{ env.NAMESPACE }} rollout undo deploy/token-api
          kubectl -n ${{ env.NAMESPACE }} rollout undo deploy/token-console
          kubectl -n ${{ env.NAMESPACE }} rollout undo deploy/token-worker

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref
          text: 'Token deploy to QA (${{ steps.tag.outputs.tag }}): ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEPLOYMENTS }}
