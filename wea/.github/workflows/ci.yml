# =====================================================================
# Wea Settlement Connector · CI (Rust)
# Reference design: ../../netstars/token/.github/workflows/README.md
# Note: Wea is operated by Wea Japan in their own GitHub repo + AWS account;
# this file lives in the shared monorepo as the agreed CI standard.
# =====================================================================
name: Wea CI

on:
  push:
    branches: [main]
    paths: ['wea/**']
  pull_request:
    paths: ['wea/**']

concurrency:
  group: ci-wea-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write

defaults:
  run:
    working-directory: wea

env:
  RUST_VERSION: '1.79'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_USER: wea_app
          MYSQL_PASSWORD: wea_app_test
          MYSQL_DATABASE: wea_test
          MYSQL_ROOT_PASSWORD: roottest
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proottest"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [3306:3306]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wea
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Apply schema
        env: {MYSQL_PWD: wea_app_test}
        run: mysql -h 127.0.0.1 -P 3306 -u wea_app wea_test < db/SCHEMA.sql
      - name: Test
        env:
          DATABASE_URL: mysql://wea_app:wea_app_test@127.0.0.1:3306/wea_test
        run: cargo test --all-features

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: wea}
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: returntocorp/semgrep-action@v1
        with: {config: 'p/rust p/security-audit'}

  build:
    needs: [test, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, callback]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.WEA_AWS_ACCOUNT_ID_TOOLING }}:role/gh-actions-wea-ci
          aws-region: ap-northeast-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v5
        with:
          context: wea
          file: wea/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.WEA_ECR_REGISTRY }}/x402-token-market/wea/${{ matrix.service }}:main-${{ github.sha }}
          provenance: true
          sbom: true
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.WEA_ECR_REGISTRY }}/x402-token-market/wea/${{ matrix.service }}:main-${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
