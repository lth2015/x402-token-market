# =====================================================================
# X402 · Ingress (AWS ALB via aws-load-balancer-controller)
# Host: qa.gateway.netstars.jp
# =====================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x402-ingress
  namespace: x402
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:REPLACE_ACCOUNT_ID:certificate/REPLACE_CERT_ID
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-northeast-1:REPLACE_ACCOUNT_ID:regional/webacl/netstars-qa-waf/REPLACE_ID
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
    external-dns.alpha.kubernetes.io/hostname: qa.gateway.netstars.jp
spec:
  ingressClassName: alb
  rules:
    - host: qa.gateway.netstars.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: x402-api
                port: { number: 80 }
