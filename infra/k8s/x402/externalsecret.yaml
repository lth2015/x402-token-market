# =====================================================================
# X402 · External Secrets (synced from AWS Secrets Manager)
# Required AWS secrets (must exist before this applies):
#   /qa/x402/db-credentials                  { host, port, user, password, dbname }
#   /qa/x402/wea-callback-hmac-secret        string
#   /qa/x402/internal-mtls-cert              { cert, key, ca }
# =====================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: x402-db-creds
  namespace: x402
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: x402-db-creds
    template:
      type: Opaque
      data:
        # build a DSN string from individual fields
        DATABASE_URL: "mysql+aiomysql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?ssl=true"
        DB_USER: "{{ .user }}"
        DB_PASSWORD: "{{ .password }}"
        DB_HOST: "{{ .host }}"
        DB_PORT: "{{ .port }}"
        DB_NAME: "{{ .dbname }}"
  data:
    - secretKey: user
      remoteRef: { key: /qa/x402/db-credentials, property: username }
    - secretKey: password
      remoteRef: { key: /qa/x402/db-credentials, property: password }
    - secretKey: host
      remoteRef: { key: /qa/x402/db-credentials, property: host }
    - secretKey: port
      remoteRef: { key: /qa/x402/db-credentials, property: port }
    - secretKey: dbname
      remoteRef: { key: /qa/x402/db-credentials, property: dbname }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: x402-hmac
  namespace: x402
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: x402-hmac
  data:
    - secretKey: WEA_CALLBACK_HMAC_SECRET
      remoteRef: { key: /qa/x402/wea-callback-hmac-secret }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: x402-redis-url
  namespace: x402
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: x402-redis-url
  data:
    - secretKey: REDIS_URL
      remoteRef: { key: /qa/shared/redis-url }
