# =====================================================================
# X402 · Deployments (api + worker)
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-api
  namespace: x402
  labels: { app: x402-api, app.kubernetes.io/component: api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: { app: x402-api }
  template:
    metadata:
      labels: { app: x402-api, app.kubernetes.io/component: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: x402-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: x402-api } }
      containers:
        - name: api
          image: REPLACE_ECR/x402-token-market/x402/api:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: x402-config }
            - secretRef:    { name: x402-db-creds }
            - secretRef:    { name: x402-hmac }
            - secretRef:    { name: x402-redis-url }
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
          resources:
            requests: { cpu: 500m,  memory: 512Mi }
            limits:   { cpu: 1500m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24       # tolerate 2 min slow start
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      terminationGracePeriodSeconds: 30
---
# X402 Worker — single leader for expire-scanner / reconciler;
# webhook-retry workers can scale horizontally (SKIP LOCKED).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x402-worker
  namespace: x402
  labels: { app: x402-worker, app.kubernetes.io/component: worker }
spec:
  replicas: 2                            # 1 leader (auto-elected via Redis Redlock) + 1 standby
  revisionHistoryLimit: 5
  strategy: { type: Recreate }           # workers don't serve traffic; recreate is safer
  selector: { matchLabels: { app: x402-worker } }
  template:
    metadata:
      labels: { app: x402-worker, app.kubernetes.io/component: worker }
    spec:
      serviceAccountName: x402-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: REPLACE_ECR/x402-token-market/x402/worker:REPLACE_TAG
          envFrom:
            - configMapRef: { name: x402-config }
            - secretRef:    { name: x402-db-creds }
            - secretRef:    { name: x402-hmac }
            - secretRef:    { name: x402-redis-url }
          env:
            - { name: WORKER_MODE, value: "all" }   # all = expire-scanner + webhook-retry + reconciler
          resources:
            requests: { cpu: 500m,  memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          livenessProbe:
            exec: { command: ["/app/healthcheck"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
      terminationGracePeriodSeconds: 60
