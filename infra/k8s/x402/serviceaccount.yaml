apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-api
  namespace: x402
  annotations:
    # IRSA: trust the AWS IAM role; pods get short-lived STS creds automatically
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/x402-api-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: x402-worker
  namespace: x402
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/x402-worker-role
