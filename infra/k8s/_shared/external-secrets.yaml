# =====================================================================
# Shared · External Secrets Operator config
# Prereq: external-secrets-operator helm chart installed in `external-secrets` ns
#         see infra/ARCHITECTURE.md §6 for path conventions.
#
# This file declares the ClusterSecretStore that maps to AWS Secrets Manager.
# Per-module ExternalSecret resources reference it by name.
# =====================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      auth:
        # Use IRSA — ServiceAccount of the ExternalSecretsOperator pod
        # has IAM Role: external-secrets-reader (read-only on /qa/*)
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
