apiVersion: v1
kind: Service
metadata: { name: token-api, namespace: token, labels: { app: token-api } }
spec:
  type: ClusterIP
  selector: { app: token-api }
  ports: [ { name: http, port: 80, targetPort: http } ]
---
apiVersion: v1
kind: Service
metadata: { name: token-console, namespace: token, labels: { app: token-console } }
spec:
  type: ClusterIP
  selector: { app: token-console }
  ports: [ { name: http, port: 80, targetPort: http } ]
