apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: token-db-creds, namespace: token }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: token-db-creds
    template:
      type: Opaque
      data:
        DATABASE_URL: "mysql+aiomysql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?ssl=true"
  data:
    - { secretKey: user,     remoteRef: { key: /qa/token/db-credentials, property: username } }
    - { secretKey: password, remoteRef: { key: /qa/token/db-credentials, property: password } }
    - { secretKey: host,     remoteRef: { key: /qa/token/db-credentials, property: host } }
    - { secretKey: port,     remoteRef: { key: /qa/token/db-credentials, property: port } }
    - { secretKey: dbname,   remoteRef: { key: /qa/token/db-credentials, property: dbname } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: token-redis-url, namespace: token }
spec:
  refreshInterval: 24h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: token-redis-url }
  data:
    - { secretKey: REDIS_URL, remoteRef: { key: /qa/shared/redis-url } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: token-provider-keys, namespace: token }
spec:
  refreshInterval: 6h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: token-provider-keys }
  data:
    - { secretKey: ANTHROPIC_API_KEY, remoteRef: { key: /qa/token/anthropic-api-key } }
    - { secretKey: OPENAI_API_KEY,    remoteRef: { key: /qa/token/openai-api-key } }
    - { secretKey: XAI_API_KEY,       remoteRef: { key: /qa/token/grok-api-key } }
    - { secretKey: GOOGLE_API_KEY,    remoteRef: { key: /qa/token/gemini-api-key } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: token-pii-key, namespace: token }
spec:
  refreshInterval: 24h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: token-pii-key }
  data:
    - { secretKey: PII_DATA_KEY, remoteRef: { key: /qa/token/pii-data-key } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: token-sso, namespace: token }
spec:
  refreshInterval: 6h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: token-sso }
  data:
    - { secretKey: OIDC_CLIENT_ID,     remoteRef: { key: /qa/token/oidc-client-id } }
    - { secretKey: OIDC_CLIENT_SECRET, remoteRef: { key: /qa/token/oidc-client-secret } }
    - { secretKey: NEXTAUTH_SECRET,    remoteRef: { key: /qa/token/nextauth-secret } }
